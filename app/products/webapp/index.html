<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>商品管理</title>
    <style>
      html,
      body,
      body > div:not(#sap-ui-static),
      .sapUiComponentContainer,
      .sapUiComponentContainer > div {
        height: 100%;
      }

      body {
        margin: 0;
      }
    </style>
    <script
      id="sap-ui-bootstrap"
      src="resources/sap-ui-core.js"
      data-sap-ui-theme="sap_horizon"
      data-sap-ui-async="true"
      data-sap-ui-compatVersion="edge"
      data-sap-ui-on-init="module:sap/ui/core/ComponentSupport"
      data-sap-ui-resource-roots='{"com.example.products": "./"}'></script>
  </head>
  <body class="sapUiBody sapUiSizeCompact" id="content">
    <div
      data-sap-ui-component
      data-name="com.example.products"
      data-id="container"
      data-settings='{"id": "com.example.products"}'></div>
  </body>
</html>
