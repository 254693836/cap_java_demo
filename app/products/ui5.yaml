specVersion: "3.1"
metadata:
  name: com.example.products
type: application
framework:
  name: SAPUI5
  version: "1.120.0"
  libraries:
    - name: sap.fe.templates
    - name: sap.m
    - name: sap.ui.core
    - name: sap.ushell
    - name: themelib_sap_horizon
resources:
  configuration:
    paths:
      webapp: webapp
server:
  customMiddleware:
    - name: fiori-tools-proxy
      afterMiddleware: compression
      configuration:
        backend:
          - path: /odata
            url: http://localhost:8080
